name: Vektor
options:
  bundleIdPrefix: app.vektor
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

packages:
  VektorEngine:
    path: Packages/VektorEngine
  VektorAviation:
    path: Packages/VektorAviation
  VektorStore:
    path: Packages/VektorStore

targets:
  Vektor:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "Resources/**/.gitkeep"
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
      - path: App/Resources/ThirdPartyNotices.txt
    dependencies:
      - package: VektorEngine
      - package: VektorAviation
      - package: VektorStore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: Vektor
        CFBundleDisplayName: Vektor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "© 2026 Patrick Grauel"
        NSCalendarsFullAccessUsageDescription: "Vektor uses calendar access to list your calendars and save the events you choose to add from the time-zone planner."
    entitlements:
      path: App/Resources/Vektor.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vektor.Vektor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Resources/Vektor.entitlements
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Vektor:
    build:
      targets:
        Vektor: all
    run:
      config: Debug
    archive:
      config: Release
  Vektor StoreKit:
    build:
      targets:
        Vektor: all
    run:
      config: Debug
      storeKitConfiguration: Vektor.storekit
    archive:
      config: Release
